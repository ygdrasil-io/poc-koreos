# JVM Arguments
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# AGP 9 — les flags DSL du build (buildSrc/gradle.properties les porte pour SON build ;
# les invocations racine et les sous-builds GradleBuild imbriqués — assembleKadreUikit-
# XCFramework, validateSwiftConsumer — relisent CE fichier et doivent voir LES MÊMES
# valeurs, sinon les scripts android samples (forme DSL héritée) ne compilent plus sur un
# démon frais). Les sources Kotlin des apps se compilent par le KGP du classpath quel que
# soit le flag (vérifié : assembleDebug de hello-window sous flags false).
systemProp.android.builtInKotlin=false
systemProp.android.newDsl=false

# AndroidX and AGP 9.0 configuration
android.useAndroidX=true
android.nonTransitiveRClass=true

# Dokka V1 mode (deliberately retained for the current publication pipeline)
org.jetbrains.dokka.experimental.gradle.pluginMode=V1Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Keep the iosX64 library target without warning about its un-runnable host test task.
kotlin.native.ignoreDisabledTargets=true

# Project coordinates — published to Maven Central under org.graphiks.kadre
group=org.graphiks.kadre
version=1.0.0

# Maven Central Publication (Override in ~/.gradle/gradle.properties — never commit secrets)
# ossrhUsername=YOUR_SONATYPE_USERNAME
# ossrhPassword=YOUR_SONATYPE_PASSWORD
# signingKey=YOUR_GPG_SECRET_KEY_ARMORED_BASE64
# signingPassword=YOUR_GPG_PASSPHRASE
