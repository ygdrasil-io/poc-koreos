name: KadreUikitDriver
options:
  bundleIdPrefix: org.graphiks.kadre.driver
  deploymentTarget:
    iOS: "16.0"
    tvOS: "16.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.0"
targets:
  KadreUikitDriverIos:
    type: application
    platform: iOS
    sources:
      - path: apps/Shared
      - path: apps/Ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.graphiks.kadre.driver.ios
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../../platform/uikit/build/bin/iosSimulatorArm64/debugFramework"
    dependencies:
      - framework: "../../../platform/uikit/build/bin/iosSimulatorArm64/debugFramework/KadreUikit.framework"
        embed: true
    info:
      path: apps/Ios/Info.plist
      properties:
        UILaunchStoryboardName: ""
        # Task 5 (rotation réelle, BCK-016) : les QUATRE orientations sont déclarées —
        # `windowScene.requestGeometryUpdate(.iOS(interfaceOrientations:))` refuse une
        # orientation hors de cette liste (l'API lit le plist, pas l'appel).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # La rotation RÉELLE est INDISPONIBLE sur ce simulateur (iPadOS 27) : TROIS refus
        # capturés, un par levier système — (1) mode fenêtré libre par défaut :
        # UISceneErrorDomain 101 « The current windowing mode does not allow for programmatic
        # changes to interface orientation » ; (2) avec la clé TN3192
        # `UIPreferredDefaultWindowingStyle: UIWindowSceneWindowingStyleFullscreen` (vérifiée
        # dans l'Info.plist construit) : même 101 — la clé ne débloque pas la rotation, elle a
        # donc été RETIRÉE ; (3) avec `UIRequiresFullScreen=true` :
        # BSActionErrorDomain « response-not-possible » — la demande est refusée à la source
        # (clé retirée aussi). Le stimulus retenu est le repli DOCUMENTÉ du brief Step 2 :
        # resize à changement d'aspect (240×320), tracé (NSLog + DriverTrace) et rapporté —
        # JAMAIS un faux vert rotation.
        # Le drop (phase 7, BCK-026) : un drag CROSS-APP est IMPOSSIBLE sur Simulator (aucune API
        # de drag système programmable — un UIDragItem ne peut pas être initié hors du process
        # hôte). La preuve du driver est donc un stimulus IN-PROCESS honnête : le VRAI
        # UIDropInteractionDelegate installé par l'attach (fetché de la vue) est appelé hook par
        # hook dans l'ordre UIKit (canHandle → enter → update → exit/perform) avec une fausse de
        # session conforme à `UIDropSession` (route épinglée par la spike Task 1) — le canal
        # delegate RÉEL d'UIKit, jamais un événement fabriqué. Le drag physique cross-app reste
        # le charter manuel Task 4.
        # Displays/devices/gamepads/mémoire (phase 8, BCK-027) : les LIMITES Simulator bornent
        # le scope du driver — PAS d'écran externe (UIScreen.screens porte l'unique écran du
        # device simulé : l'inventaire réel + single-viewport HostViewport, le multi-écrans
        # AirPlay reste le charter matériel) et PAS de manette BLUETOOTH réelle du simulateur.
        # FAIT ÉPINGLÉ AU DRIVER (Xcode 27, l'hôte de gate) : le Simulator PONTE les devices
        # GameController du Mac hôte DANS le process simulé — la souris gamer de l'hôte y
        # arrive en GCController à profil étendu, le clavier du Mac en GCKeyboard coalesced ;
        # l'inventaire publié les PORTE (le miroir est le contrat, jamais une fabrication).
        # Les scénarios empty-honest épinent donc le MIROIR PARFAIT contre l'oracle SDK relu
        # par le test lui-même : la forme VIDE est la référence sans périphérique (le zéro du
        # nom du scénario, tenu sur toute machine sans device ponté) et la divergence
        # fabrication/omission échoue SUR TOUTE machine. La notification
        # mémoire est le stimulus IN-PROCESS sanctionné (le post réel
        # UIApplicationDidReceiveMemoryWarningNotification — observateur → source process →
        # relais → signaux, la chaîne entre extrémités) ; la DÉCISION OS de tirer la
        # notification (et les livraisons réelles d'écrans branchés) reste le charter manuel.
        # Capture (phase 9) : la LIMITE Simulator épingle le scope des scénarios driver —
        # les FRAMES ReplayKit NE SONT JAMAIS LIVRÉES sur Simulator (fait T3 : le start
        # `RPScreenRecorder.startCaptureWithHandler` ne rend JAMAIS sa complétion sur aucun
        # hôte mesuré, le stop répond -5829). AUCUN scénario ne prétend donc des frames
        # HostChoice ici — le bras HostChoice y prouve son plan de CONTRÔLE et ses refus
        # honnêtes (`Unsupported(CaptureOpen)` à l'admission, zéro réservation de port,
        # zéro frame fabriquée) ; les frames ReplayKit restent le charter DEVICE. Le flux
        # Surface, lui, EST pleinement prouvable au driver (l'app hôte du driver rend des
        # rasters cohérents — fait T1 — QUAND la vue capturée porte du contenu rendu ;
        # FAIT Task 6 : la vue VIDE du fixture rend un raster menteur — layer.render,
        # bitmapInfo 0x1 in-table mais bytesPerRow = 2·w — que l'honnêteté du kernel refuse
        # à juste titre `frame-format-out-of-table` ; les scénarios posent un stimulus de
        # contenu avant l'ouverture) : c'est LÀ que vit la preuve bout en bout des frames
        # (`uikit-capture-surface-stream-bounded`).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).DriverSceneDelegate
  KadreUikitDriverTvOs:
    type: application
    platform: tvOS
    sources:
      - path: apps/Shared
      - path: apps/Tvos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.graphiks.kadre.driver.tvos
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../../platform/uikit/build/bin/tvosSimulatorArm64/debugFramework"
    dependencies:
      - framework: "../../../platform/uikit/build/bin/tvosSimulatorArm64/debugFramework/KadreUikit.framework"
        embed: true
    info:
      path: apps/Tvos/Info.plist
      properties:
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).DriverSceneDelegate
  KadreUikitDriverIosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/Shared
      - path: tests/Ios
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../../platform/uikit/build/bin/iosSimulatorArm64/debugFramework"
    dependencies:
      - target: KadreUikitDriverIos
      - framework: "../../../platform/uikit/build/bin/iosSimulatorArm64/debugFramework/KadreUikit.framework"
        embed: false
  KadreUikitDriverTvOsTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: tests/Shared
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../../platform/uikit/build/bin/tvosSimulatorArm64/debugFramework"
    dependencies:
      - target: KadreUikitDriverTvOs
      - framework: "../../../platform/uikit/build/bin/tvosSimulatorArm64/debugFramework/KadreUikit.framework"
        embed: false
schemes:
  KadreUikitDriverIos:
    build:
      targets:
        KadreUikitDriverIos: all
    test:
      targets:
        - KadreUikitDriverIosTests
  KadreUikitDriverTvOs:
    build:
      targets:
        KadreUikitDriverTvOs: all
    test:
      targets:
        - KadreUikitDriverTvOsTests
