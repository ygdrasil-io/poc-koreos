# Le build agrégateur du consumer Swift est une racine Gradle SÉPARATE du dépôt — sans ce
# fichier, son démon démarre au heap par défaut (512 MiB) et meurt de GC thrashing pendant
# les liens Kotlin/Native du consumer-kmp et de l'assemblage XCFramework (vérifié deux fois
# lors de l'activation BCK-018/BCK-019). Miroir de la racine du dépôt : le même heap que le
# build principal. S'applique AUSSI aux sous-builds GradleBuild qu'il pilote.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
