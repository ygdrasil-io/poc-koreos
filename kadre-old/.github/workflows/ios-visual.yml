name: ios-visual

# iOS simulator lifecycle and capture-code contract. A physical-device Metal diagnostic,
# when needed, is intentionally kept out of this blocking simulator workflow.

on:
  push:
    branches: [master]
    paths:
      - 'samples/hello-triangle-ios/**'
      - '.github/workflows/ios-visual.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/hello-triangle-ios/**'
      - '.github/workflows/ios-visual.yml'
  workflow_dispatch:

jobs:
  ios-visual:
    name: ios-visual
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run iOS simulator contract
        run: scripts/test-uikit-simulator.sh
