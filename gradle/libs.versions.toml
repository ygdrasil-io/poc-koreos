[versions]
# Core Tooling
kotlin = "2.4.20"

# kextract (CLI tool for Obj-C/FFM bindings) — version used for generation
# Repo: https://github.com/klang-toolkit/kextract
# Download: https://github.com/klang-toolkit/kextract/releases/tag/v0.0.2
kextract = "0.0.2"
agp = "9.0.0"
compose-multiplatform = "1.11.0"
dokka = "2.2.0"

# wgpu4k — WebGPU binding for Kotlin Multiplatform
# Maven Central: io.ygdrasil:wgpu4k:0.1.1
# Repo: https://github.com/wgpu4k/wgpu4k
wgpu4k = "0.1.1"
# webgpu-ktypes — version synchronized with wgpu4k:0.1.1
# The descriptor data classes (VertexState, FragmentState, etc.) are in webgpu-ktypes-descriptors
webgpu-ktypes = "0.0.7"

# Libraries
kffi-x11 = "1.0.0-SNAPSHOT"
kffi-wayland = "1.0.0-SNAPSHOT"
kffi-objc = "1.0.0-SNAPSHOT"
# Dev pin for win32 phase 7: the OLE drop KFFI alias exists only in Maven local
# until the upstream snapshot is published; restore the Central pin for delivery.
kffi-win32 = "1.0.0-win32-ole-drop-local-SNAPSHOT"
kffi-posix = "1.0.0-SNAPSHOT"
coroutines = "1.10.1"
kotlinx-browser = "0.5.0"
koin = "4.0.0"
ktor = "3.0.3"
kotlinx-serialization = "1.8.0"
androidx-activity-compose = "1.10.1"
androidx-activity = "1.10.1"
androidx-lifecycle = "2.8.7"

# L'instrumentation Android (le sample compose-showcase, phase 9) — les versions exactes
# déjà épinglées par `consumers/android`.
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"
androidx-test-core = "1.6.1"

[libraries]
# kffi X11 FFI snapshot
kffi-x11 = { module = "org.graphiks:kffi-x11", version.ref = "kffi-x11" }

# kffi Wayland FFI snapshot
kffi-wayland = { module = "org.graphiks:kffi-wayland", version.ref = "kffi-wayland" }
# kffi Objective-C FFI snapshot
kffi-objc = { module = "org.graphiks:kffi-objc", version.ref = "kffi-objc" }

# kffi Win32 FFI snapshot
kffi-win32 = { module = "org.graphiks:kffi-win32", version.ref = "kffi-win32" }

# kffi Linux POSIX FFI snapshot
kffi-posix = { module = "org.graphiks:kffi-posix-jvm", version.ref = "kffi-posix" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Bindings DOM du navigateur (wasm/js) — document, HTMLElement…
# Séparé de la stdlib Kotlin/Wasm ; platform:web l'apporte aux samples qui
# n'ont pas Compose.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

# Les artefacts compose en coordonnées directes (le sample compose-showcase, phase 9) : une
# application AGP pure — le plugin `org.jetbrains.compose` et ses accesseurs visent le
# conteneur KMP ; ici les MÊMES artefacts publiés de JetBrains, la version du même ref.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
# Material3 du tour Android (phase 11, `samples/android-kadre-tour`) : le shell de la
# visite (Scaffold, NavigationBar, drawer) le demande — le MÊME artefact multiplateforme
# que les cibles jvm/wasmJs du tour (`samples/desk-tour`, accesseur `compose.material3`).
# Material3 suit SA propre ligne de versions (calée sur androidx material3) : la version
# que le plugin compose 1.11.0 résout lui-même — le cache desk-tour le prouve — est 1.9.0.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version = "1.9.0" }

# L'instrumentation Android (le sample compose-showcase, phase 9) — les versions exactes
# déjà épinglées par `consumers/android`.
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

# Koin (Dependency Injection)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Ktor (Networking)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# wgpu4k
wgpu4k = { module = "io.ygdrasil:wgpu4k", version.ref = "wgpu4k" }
# wgpu4k descriptors (data classes: VertexState, FragmentState, RenderPipelineDescriptor, etc.)
webgpu-ktypes-descriptors = { module = "io.ygdrasil:webgpu-ktypes-descriptors", version.ref = "webgpu-ktypes" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
