name: pong-e2e

# Scripted Pong (Web) E2E test — scripted keyboard input + multi-frame
# assertions + video. Follow-up to the `web-e2e` smoke on hello-triangle;
# here we prove that a complete interactive demo runs end-to-end:
#   1. Boot wgpu4k Web
#   2. Continuous animation (ball + AI moving without input)
#   3. Scripted keyboard input (ArrowDown / ArrowUp) reaching the handler
#   4. Visible effect of the input (right paddle moved)
#
# The .webm video + the Playwright trace are systematically archived as an
# artifact — usable for communication, debugging, and visual review of PRs.

on:
  push:
    branches: [master]
    paths:
      - 'samples/pong/**'
      - 'kadre-js/**'
      - 'kadre-web-common/**'
      - 'kadre-core/**'
      - '.github/workflows/pong-e2e.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/pong/**'
      - 'kadre-js/**'
      - 'kadre-web-common/**'
      - 'kadre-core/**'
      - '.github/workflows/pong-e2e.yml'
  workflow_dispatch:

jobs:
  pong-e2e:
    name: pong-e2e
    # macOS runner with stable Chrome (release channel): accelerated GPU + mature
    # WebGPU. The Pong scenario (multi-second animation + pixel-diff assertions)
    # is more demanding than the single-frame smoke of hello-triangle;
    # SwiftShader on Linux gives slower and less deterministic frames.
    # Same choice as `web-e2e` (see branch `feat/web-e2e-chrome-mac-win`).
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build samples/pong (production JS bundle)
        run: ./gradlew :samples:pong:jsBrowserDistribution --no-daemon --stacktrace

      - name: Install E2E deps + ffmpeg (video recording)
        working-directory: samples/pong/e2e
        run: |
          npm install
          # ffmpeg for Playwright video recording (not bundled with @playwright/test).
          # Chrome itself is the system Chrome at the default path.
          npx playwright install ffmpeg

      - name: Run Playwright scenario
        working-directory: samples/pong/e2e
        run: npx playwright test

      # Scenario summary in the Job Summary (visible directly on the run page).
      - name: Publier le résumé du scénario
        if: always()
        run: |
          SUMMARY=samples/pong/e2e/test-results/scenario-summary.md
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Video, trace, key frames — all retrievable from the run's artifacts tab.
      - name: Upload artefacts (vidéo, trace, frames)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pong-e2e-${{ github.run_number }}
          path: |
            samples/pong/e2e/test-results/**/*.webm
            samples/pong/e2e/test-results/**/trace.zip
            samples/pong/e2e/test-results/frame*.png
            samples/pong/e2e/test-results/scenario-summary.md
          if-no-files-found: warn
