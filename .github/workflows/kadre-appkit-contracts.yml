name: Kadre AppKit Contracts

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  appkit-contracts:
    name: appkit-contracts
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/test-kadre-appkit-contracts.sh

      - name: Collect AppKit environment
        run: bash scripts/collect-appkit-diagnostics.sh kadre/backend/appkit/build/ci-diagnostics

      - name: Run AppKit contract gate
        run: scripts/test-kadre-appkit-contracts.sh

      - name: Collect native crash reports
        if: always()
        run: |
          destination="kadre/backend/appkit/build/ci-diagnostics/crash-reports"
          mkdir -p "$destination"
          source="$HOME/Library/Logs/DiagnosticReports"
          if [[ -d "$source" ]]; then
            find "$source" -maxdepth 1 -type f -print -exec cp {} "$destination" \;
          else
            echo "No DiagnosticReports directory at $source" > "$destination/status.txt"
          fi

      - name: Upload AppKit diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-contract-artifacts
          path: |
            kadre/backend/appkit/build/contract-evidence/
            kadre/backend/appkit/build/test-results/
            kadre/backend/appkit/build/reports/tests/
            kadre/backend/appkit/build/ci-diagnostics/
          if-no-files-found: ignore
