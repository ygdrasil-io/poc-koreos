name: Kadre AppKit Contracts

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  appkit-contracts:
    name: appkit-contracts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A cold Intel Gradle build can consume most of the tests watchdog before
    # evidence generation begins. The phase watchdogs remain the stricter
    # protection against hung child processes.
    timeout-minutes: 30

    strategy:
      # Both legs must always run so that a failure on one architecture never
      # hides the proof produced on the other.
      fail-fast: false
      matrix:
        include:
          # arm64 never takes the x86_64-only Objective-C struct-return path
          # (objc_msgSend_stret), so Intel needs its own leg to be exercised.
          - arch: arm64
            runner: macos-26
            artifacts: appkit-contract-artifacts
          - arch: x86_64
            runner: macos-26-intel
            artifacts: appkit-contract-artifacts-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/test-kadre-appkit-contracts.sh

      - name: Collect AppKit environment
        run: bash scripts/collect-appkit-diagnostics.sh kadre/backend/appkit/build/ci-diagnostics

      - name: Run native AppKit fullscreen witness
        id: native_fullscreen_witness
        continue-on-error: true
        run: |
          KADRE_APPKIT_FULLSCREEN_WITNESS_OUTPUT="kadre/backend/appkit/build/ci-diagnostics/fullscreen-witness.json" \
            bash scripts/test-appkit-fullscreen-witness.sh

      - name: Run AppKit contract gate
        id: appkit_contract_gate
        continue-on-error: true
        run: scripts/test-kadre-appkit-contracts.sh

      - name: Require AppKit gates
        if: always()
        run: |
          if [[ '${{ steps.native_fullscreen_witness.outcome }}' != 'success' ]]; then
            echo "The native AppKit fullscreen witness failed; inspect fullscreen-witness.json." >&2
            exit 1
          fi
          if [[ '${{ steps.appkit_contract_gate.outcome }}' != 'success' ]]; then
            echo "The AppKit contract gate failed; inspect the contract diagnostics and evidence." >&2
            exit 1
          fi

      - name: Collect native crash reports
        if: always()
        run: |
          destination="kadre/backend/appkit/build/ci-diagnostics/crash-reports"
          mkdir -p "$destination"
          source="$HOME/Library/Logs/DiagnosticReports"
          if [[ -d "$source" ]]; then
            find "$source" -maxdepth 1 -type f -print -exec cp {} "$destination" \;
          else
            echo "No DiagnosticReports directory at $source" > "$destination/status.txt"
          fi

      - name: Upload AppKit diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifacts }}
          path: |
            kadre/backend/appkit/build/contract-evidence/
            kadre/backend/appkit/build/test-results/
            kadre/backend/appkit/build/reports/tests/
            kadre/backend/appkit/build/ci-diagnostics/
          if-no-files-found: ignore
