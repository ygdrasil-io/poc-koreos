name: Kadre AppKit Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  appkit-contracts:
    name: appkit-contracts
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/test-kadre-appkit-contracts.sh

      - name: Run AppKit contract gate
        run: scripts/test-kadre-appkit-contracts.sh

      - name: Upload AppKit contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-contract-evidence
          path: kadre/backend/appkit/build/contract-evidence/contract-evidence.json
          if-no-files-found: ignore
