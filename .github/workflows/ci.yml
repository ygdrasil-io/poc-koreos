# ─────────────────────────────────────────────────────────────────────────────
# Kadre CI — Multi-Platform
#
# Two-tier strategy (GRA-160 + GRA-39):
#
#   ┌─ Fast-Track (all branches)         ────────────────────────────────────┐
#   │  build-and-test  JVM only (macos-latest) — feedback < 10 min          │
#   │  macos-build     AppKit + macOS samples — feedback < 5 min            │
#   └─────────────────────────────────────────────────────────────────────────┘
#
#   ┌─ Deep-Testing (PR → master, push master, or claude/** branches)  ───────┐
#   │  build-and-test      JVM + allTests (macos-15, iOS simulator)          │
#   │  ios-build           iOS simulator arm64 — build + link + tests        │
#   │  android-build       Android (ubuntu-latest) — build + assembleDebug   │
#   │  windows-build       Win32 FFM (windows-latest) — build + jvmTest      │
#   │  linux-x11-build     X11/Xvfb (ubuntu-latest) — jvmTest + build       │
#   │  linux-wayland-build Wayland (ubuntu-latest) — jvmTest + build        │
#   └─────────────────────────────────────────────────────────────────────────┘
#
#   Note: ios-build and android-build are expensive jobs (macOS / Ubuntu
#   runners + native compilation). They are triggered on:
#     • push / PR to master (historical Deep-Testing)
#     • push / PR on claude/** branches (CI feature branches)
#   On the other branches, only the Fast-Track JVM runs (<10 s).
#
# ─────────────────────────────────────────────────────────────────────────────

name: Kadre CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # ── Job 1: build-and-test ─────────────────────────────────────────────────
  #
  # Fast-Track   : JVM only (non-master branches)
  # Deep-Testing : allTests including the iOS simulator (PR to master / master)
  #
  # Uses macos-15 because this runner includes the iOS simulator required for
  # the iosSimulatorArm64 Kotlin/Native tests in Deep mode.
  build-and-test:
    name: build-and-test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Detect the test mode
      - name: Determine test strategy
        id: strategy
        run: |
          if [[ "${{ github.base_ref }}" == "master" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "mode=deep" >> $GITHUB_OUTPUT
            echo "→ Deep-Testing (all targets) — PR to master or master branch"
          else
            echo "mode=fast-track" >> $GITHUB_OUTPUT
            echo "→ Fast-Track JVM only"
          fi

      # Fast-Track: JVM tests only (~3 min warm cache)
      - name: Fast-Track JVM tests
        if: steps.strategy.outputs.mode == 'fast-track'
        run: |
          # ABI validation is intentionally disabled in CI during incubation.
          # Keep the workflow fast-track while the public API is still moving;
          # uncomment these tasks once the ABI baseline is stable enough to gate PRs.
          tasks=(
            :kadre-core:jvmTest
            :kadre-appkit:jvmTest
            # :kadre-core:checkKotlinAbi
            # :kadre-appkit:checkKotlinAbi
            # :kadre-uikit:checkKotlinAbi
            # :kadre-android:checkKotlinAbi
            # :kadre:checkKotlinAbi
          )
          ./gradlew "${tasks[@]}" \
            --no-daemon \
            --stacktrace

      # Deep-Testing: allTests (JVM + iOS simulator arm64)
      # The iOS simulator is available on macos-15 via Xcode.
      - name: Deep-Testing (JVM + iOS simulator)
        if: steps.strategy.outputs.mode == 'deep'
        run: |
          # ABI validation is intentionally disabled in CI during incubation.
          # Keep the workflow fast-track while the public API is still moving;
          # uncomment these tasks once the ABI baseline is stable enough to gate PRs.
          tasks=(
            :kadre-core:jvmTest
            :kadre-core:iosSimulatorArm64Test
            :kadre-appkit:jvmTest
            :kadre:jvmTest
            :kadre:iosSimulatorArm64Test
            # :kadre-core:checkKotlinAbi
            # :kadre-appkit:checkKotlinAbi
            # :kadre-uikit:checkKotlinAbi
            # :kadre-android:checkKotlinAbi
            # :kadre:checkKotlinAbi
          )
          ./gradlew "${tasks[@]}" \
            --no-daemon \
            --stacktrace

  # ── Job 2: macos-build ───────────────────────────────────────────────────
  #
  # Compiles the macOS-specific modules (AppKit FFM) and the JVM/macOS samples.
  # Validates that kadre-appkit + samples compile on a standard macOS runner.
  # Runs on all branches for fast feedback.
  macos-build:
    name: macos-build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile the macOS-only modules + JVM samples
      # hello-triangle requires wgpu4k — compiled but not run in CI.
      - name: Build macOS modules + JVM samples
        run: |
          ./gradlew \
            :kadre-core:jvmTest \
            :kadre-appkit:build \
            :kadre:jvmTest \
            :samples:hello-metal:build \
            :samples:hello-triangle:build \
            :samples:hello-window:compileKotlinJvm \
            --no-daemon \
            --stacktrace

  # ── Job 3: ios-build ─────────────────────────────────────────────────────
  #
  # Builds the iOS targets (iosSimulatorArm64, iosArm64, iosX64) and runs
  # the Kotlin/Native tests on the iosSimulatorArm64 simulator.
  #
  # Runs on Deep-Testing:
  #   • PRs to master / push to master
  #   • push or PR on claude/** branches (CI feature branches)
  # Avoids consuming the expensive macOS runners on all the other branches.
  ios-build:
    name: ios-build
    runs-on: macos-15
    if: |
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/claude/') ||
      startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile all modules for the iOS simulator arm64 target.
      # The Kotlin/Native tests run via the built-in Xcode simulator.
      - name: Build iOS targets (iosSimulatorArm64)
        run: |
          ./gradlew \
            :kadre-core:compileKotlinIosSimulatorArm64 \
            :kadre-uikit:compileKotlinIosSimulatorArm64 \
            :kadre:compileKotlinIosSimulatorArm64 \
            :samples:hello-touch:compileKotlinIosSimulatorArm64 \
            :samples:hello-window:compileKotlinIosSimulatorArm64 \
            --no-daemon \
            --stacktrace

      # Run Kotlin/Native tests on iOS simulator (iosSimulatorArm64)
      - name: Run iOS simulator tests
        run: |
          ./gradlew \
            :kadre-core:iosSimulatorArm64Test \
            :kadre:iosSimulatorArm64Test \
            --no-daemon \
            --stacktrace

  # ── Job 4: android-build ─────────────────────────────────────────────────
  #
  # Builds the Android modules and the Android samples (assembleDebug).
  # Uses ubuntu-latest (Android SDK pre-installed on the GitHub runners).
  #
  # Runs on Deep-Testing:
  #   • PRs to master / push to master
  #   • push or PR on claude/** branches (CI feature branches)
  #
  # Instrumented tests: the Kadre modules do not yet have Robolectric
  # tests — the job validates compilation and APK packaging.
  # To be extended with Robolectric once Android tests are added.
  android-build:
    name: android-build
    runs-on: ubuntu-latest
    if: |
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/claude/') ||
      startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Android SDK is pre-installed on ubuntu-latest.
      # JDK 17 is required by the Android Gradle plugin (AGP 8.x+).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Configure the Android SDK path from the ANDROID_HOME environment
      # variable provided by the ubuntu-latest runner.
      - name: Set up Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # Build the Android modules + Android samples (debug APK).
      # AGP generates APKs compiled for API 24+ (minSdk=24 on all modules).
      - name: Build Android modules + samples
        run: |
          ./gradlew \
            :kadre-android:build \
            :kadre:compileDebugKotlinAndroid \
            :samples:hello-touch-android:assembleDebug \
            :samples:hello-window-android:assembleDebug \
            --no-daemon \
            --stacktrace

  # ── Job 5: web-build ─────────────────────────────────────────────────────
  #
  # Compiles the web modules (JS/IR + wasmJs).
  # Runs on Deep-Testing.
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    if: |
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/claude/') ||
      startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build web modules (JS + Wasm)
        run: |
          ./gradlew \
            :kadre-core:jvmTest \
            :kadre-js:compileKotlinJs \
            :kadre-wasm:compileKotlinWasmJs \
            --no-daemon \
            --stacktrace

  # ── Job 6: windows-build ─────────────────────────────────────────────────
  #
  # Builds the Win32 modules (kadre-win32 FFM) and runs the Windows JVM tests.
  # Validates the Win32-specific compilation and the hello-triangle sample on Windows.
  #
  # Runs on Deep-Testing:
  #   • PRs to master / push to master
  #   • push or PR on claude/** branches (CI feature branches)
  #
  # Uses shell: bash (Git Bash, available on windows-latest) to run
  # ./gradlew in a way compatible with the other jobs.
  windows-build:
    name: windows-build
    runs-on: windows-latest
    if: |
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/claude/') ||
      startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # Build the Win32 modules + JVM core tests + hello-triangle sample.
      # Git Bash (shell: bash) lets us use ./gradlew directly on Windows.
      - name: Build Win32 modules + JVM tests
        shell: bash
        run: |
          ./gradlew \
            :kadre-core:jvmTest \
            :kadre-win32:build \
            :kadre-win32:jvmTest \
            :samples:hello-triangle:build \
            --no-daemon \
            --stacktrace

  # ── Job 6: linux-x11-build ──────────────────────────────────────────────
  #
  # Builds the kadre-x11 module and runs the JVM tests under Xvfb (virtual X11).
  # Uses ubuntu-latest with the X11 dev packages to provide libX11 at runtime.
  #
  # Runs on Deep-Testing:
  #   • PRs to master / push to master
  #   • push or PR on claude/** branches (CI feature branches)
  #
  # Note: kadre-x11:jvmTest automatically detects the absence of a display and
  # skips the tests requiring an X server — xvfb-run -a provides a stable
  # virtual display for the tests that need one.
  # hello-triangle (native wgpu) is excluded for now.
  linux-x11-build:
    name: linux-x11-build
    runs-on: ubuntu-latest
    if: |
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/claude/') ||
      startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # Install the X11 dependencies required by kadre-x11 (FFM + JNI).
      # libX11-dev provides the runtime .so; xvfb provides a virtual X server.
      - name: Install X11 dependencies
        run: sudo apt-get install -y xvfb libx11-dev libxi-dev libxkbcommon-dev

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # xvfb-run -a starts a virtual X display for the tests that need one.
      # The display-less tests (compile-only) run normally.
      - name: Build X11 modules + JVM tests (Xvfb)
        run: |
          xvfb-run -a ./gradlew \
            :kadre-core:jvmTest \
            :kadre-x11:build \
            --no-daemon \
            --stacktrace

  # ── Job 7: linux-wayland-build ──────────────────────────────────────────
  #
  # Builds the kadre-wayland module and runs the Wayland JVM tests.
  # Uses ubuntu-latest with the Wayland dev packages.
  #
  # Runs on Deep-Testing:
  #   • PRs to master / push to master
  #   • push or PR on claude/** branches (CI feature branches)
  #
  # Note: no Wayland server available in CI — wl_display_connect()
  # returns null and the tests requiring a Wayland compositor are skipped
  # automatically. The job validates compilation and the compositor-independent
  # tests.
  linux-wayland-build:
    name: linux-wayland-build
    runs-on: ubuntu-latest
    if: |
      github.base_ref == 'master' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/claude/') ||
      startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # Install the Wayland dependencies required by kadre-wayland (FFM + JNI).
      - name: Install Wayland dependencies
        run: sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No display needed: the tests compile and run without a Wayland
      # compositor. Native Wayland loading is disabled because ubuntu-latest
      # has libwayland-client installed but no compositor, which makes native
      # smoke tests unsafe; compositor-backed tests live in visual workflows.
      - name: Build Wayland modules + JVM tests
        env:
          KADRE_WAYLAND_DISABLE_NATIVE: '1'
        run: |
          ./gradlew \
            :kadre-core:jvmTest \
            :kadre-wayland:build \
            --no-daemon \
            --stacktrace
