name: ios-visual

# Offscreen GPU capture on iOS — best-effort, NON-BLOCKING.
# Runs the Kotlin/Native test on the iOS simulator. The headless simulator does not
# expose a Metal device (MTLCreateSystemDefaultDevice == null) → the test then skips
# cleanly. Actual rendering of the triangle requires an iOS device (or a simulator with
# Metal). The job mainly serves to ensure that the iOS capture code compiles and links.

on:
  push:
    branches: [master]
    paths:
      - 'samples/hello-triangle-ios/**'
      - '.github/workflows/ios-visual.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/hello-triangle-ios/**'
      - '.github/workflows/ios-visual.yml'
  workflow_dispatch:

jobs:
  ios-visual:
    name: ios-visual
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile + link + run on the simulator. Non-blocking: the test skips if there is
      # no Metal (the headless simulator case), so it PASSES; we keep continue-on-error
      # as a precaution (toolchain/simulator).
      - name: Capture GPU iOS (simulateur, best-effort)
        continue-on-error: true
        run: |
          ./gradlew :samples:hello-triangle-ios:iosSimulatorArm64Test --no-daemon --stacktrace
