name: Kadre UIKit Contracts

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  uikit-ios-simulator:
    name: uikit-ios-simulator
    # Image publique en preview (actions/runner-images#14404 : Xcode 27 préinstallé sur
    # macOS 27) — choisie car macos-26 livre au mieux Xcode 26.6 / runtimes 26.x, et la
    # roadmap interdit de dégrader silencieusement les destinations (iOS/tvOS 27.0).
    # Quirk connu du preview (Metal Toolchain possiblement absente) : sans effet sur cette
    # gate. Toute instabilité apparaît en job rouge à diagnostiquer, jamais en skip.
    runs-on: xcode-27
    # Budget 40 min (TEST-STRATEGY.md §9.1, exception revue) : les coûts fixes À FROID sont
    # dominants et variables — run 38109607559 : >15 min ; run 38131804115 : pré-boot 2m30 +
    # latence `simctl list` ~4m30 (enregistrement des devices après boot) + configuration
    # Gradle ~4m30 avant le premier compile, xcodebuild tué à 25 min. Le SLO p95 ≤ 8 min
    # s'entend gate CHAUD. Le cache ~/.konan ci-dessous retire le re-téléchargement du
    # toolchain Kotlin/Native de chaque run à froid.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          # La toolchain K/N vit dans ~/.konan (PAS dans ~/.gradle) : sans ce cache, chaque
          # runner froid la re-télécharge. La clé suit la version Kotlin de libs.versions.toml.
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.4.20

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/test-uikit-simulator.sh

      # xcodegen n'est PAS préinstallé sur l'image (constaté night-zero 38795989334 :
      # « A problem occurred starting process 'command 'xcodegen'' » sur
      # :generateConsumerProject) — le consumer-aggregator régénère son xcodeproj
      # en dépendance dure des suites consumer. La version brew (non épinglée) régénère
      # le pbxproj à partir de project.yml, source de vérité ; le pbxproj commité reste
      # la référence de revue.
      - name: Install xcodegen
        run: brew install xcodegen

      # H2 (diagnostic run PR 38109607559, run verte 38111601105) : sur le device FRAIS du
      # runner, la première app lancée par XCTest peut rester connectée SANS jamais être
      # activée (stall FrontBoard/SpringBoard du premier boot — trace : willConnectTo reçu,
      # aucun didBecomeActive en ~5 min). Le pré-boot borne cette course : le device est
      # booté et déclaré « fully booted » (bootstatus -b) AVANT le gate. Idempotent (déjà
      # booté = no-op avalé) ; l'échec de la résolution du device reste fatal.
      - name: Pre-boot the iPad simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for ds in devices.values() for d in ds if d['name'] == 'iPad Pro 11-inch (M5)' and d.get('isAvailable', True)))")"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run iOS simulator UIKit contract gate
        run: ./scripts/test-uikit-simulator.sh ios

      - name: Upload iOS simulator contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uikit-ios-contract-artifacts
          path: |
            kadre/contracts/driver/uikit/build/contract-evidence/
            kadre/contracts/driver/uikit/build/xcresult/
          if-no-files-found: ignore
          include-hidden-files: true

  uikit-tvos-simulator:
    name: uikit-tvos-simulator
    # Image publique en preview (actions/runner-images#14404 : Xcode 27 préinstallé sur
    # macOS 27) — choisie car macos-26 livre au mieux Xcode 26.6 / runtimes 26.x, et la
    # roadmap interdit de dégrader silencieusement les destinations (iOS/tvOS 27.0).
    # Quirk connu du preview (Metal Toolchain possiblement absente) : sans effet sur cette
    # gate. Toute instabilité apparaît en job rouge à diagnostiquer, jamais en skip.
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.4.20

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/test-uikit-simulator.sh

      # xcodegen n'est PAS préinstallé sur l'image (night-zero 38795989334) — voir la
      # note complète dans le job iOS ci-dessus.
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run tvOS simulator UIKit contract gate
        run: ./scripts/test-uikit-simulator.sh tvos

      - name: Upload tvOS simulator contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uikit-tvos-contract-artifacts
          path: |
            kadre/contracts/driver/uikit/build/contract-evidence/
            kadre/contracts/driver/uikit/build/xcresult/
          if-no-files-found: ignore
          include-hidden-files: true
