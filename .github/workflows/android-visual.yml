name: android-visual

# Offscreen GPU capture on Android — instrumented test on an emulator.
# hello-triangle-android-capture renders the wgpu4k Vulkan triangle into an offscreen
# texture (a Surface backed by a SurfaceTexture → ANativeWindow via android-native-helper),
# reads the framebuffer back and checks the RGB triangle. The emulator provides a software
# Vulkan (SwiftShader). NON-BLOCKING.

on:
  push:
    branches: [master]
    paths:
      - 'samples/hello-triangle-android-capture/**'
      - '.github/workflows/android-visual.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/hello-triangle-android-capture/**'
      - '.github/workflows/android-visual.yml'
  workflow_dispatch:

jobs:
  android-visual:
    name: android-visual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      # KVM to speed up the emulator on ubuntu.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Offscreen GPU capture on an emulator (software SwiftShader Vulkan). Non-blocking.
      - name: Capture GPU Android (émulateur, best-effort)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :samples:hello-triangle-android-capture:connectedDebugAndroidTest --no-daemon --stacktrace

      # The PNG capture, written via TestStorage, is pulled back by the runner under
      # build/outputs/.../additional_output. We upload it as an artifact.
      - name: Upload capture Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-triangle-android-capture
          path: samples/hello-triangle-android-capture/build/outputs/**/hello-triangle-android.png
          if-no-files-found: warn
