name: Kadre Win32 Contracts

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Win32 contract gate
        run: >-
          scripts/test-kadre-win32-contracts.sh
          :kadre:runtime:jvmTest :kadre:platform:desktop:jvmTest
          :kadre:contracts:validator:jvmTest :kadre:contracts:validator:validateContractRegistry

      - name: Require the Win32 gate
        if: always()
        run: |
          if [ -f kadre/backend/win32/build/ci-diagnostics/tests.log ]; then
            tail -5 kadre/backend/win32/build/ci-diagnostics/tests.log
          fi
          for id in W32-001 W32-002 W32-003 W32-004 W32-005 W32-006 W32-007 W32-008 W32-009 W32-010 W32-011 W32-012 W32-013 W32-014 W32-015 W32-016 W32-017 W32-018 W32-019 W32-020 W32-021 W32-022 BCK-025 SES-002 PMP-001; do
            test -s "kadre/backend/win32/build/contract-evidence/$id.json"
          done

      - name: Upload diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-contract-diagnostics
          if-no-files-found: error
          path: |
            kadre/backend/win32/build/contract-evidence/
            kadre/backend/win32/build/test-results/
            kadre/backend/win32/build/ci-diagnostics/
            kadre/backend/win32/build/win32-integration/
