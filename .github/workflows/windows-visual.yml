name: windows-visual

# Windows visual regression via GPU readback.
# hello-triangle renders an offscreen frame (hidden Win32 window → surface → offscreen
# texture), writes a PNG via wgpu readback, compared against a committed baseline.
# NON-BLOCKING (non-deterministic GPU rendering / uncertain runner GPU availability).

on:
  push:
    branches: [master]
    paths:
      - 'samples/hello-triangle/**'
      - 'tests/visual/**'
      - '.github/workflows/windows-visual.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/hello-triangle/**'
      - 'tests/visual/**'
      - '.github/workflows/windows-visual.yml'
  workflow_dispatch:

jobs:
  windows-visual:
    name: windows-visual
    runs-on: windows-latest
    permissions:
      contents: write        # push captures to the orphan branch ci-visual-reports
      pull-requests: write   # PR comment with the inline gallery
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # The `run` task executes in the sample's directory → the PNG (relative path)
      # is written under samples/hello-triangle/build/visual/.
      - name: Capture GPU offscreen (hello-triangle)
        id: capture
        continue-on-error: true
        run: |
          ./gradlew :samples:hello-triangle:run \
            --args="--capture build/visual/hello-triangle.actual.png" \
            --no-daemon --stacktrace

      - name: Diff visuel vs baseline (non bloquant)
        if: always()
        run: |
          cd tests/visual && npm install && cd -
          DIR=samples/hello-triangle/build/visual
          node tests/visual/diff-cli.js \
            "$DIR/hello-triangle.actual.png" \
            tests/visual/baselines/windows/hello-triangle.png \
            "$DIR/hello-triangle.diff.png" \
            0.02 \
            "$DIR/report.json" \
            Windows || true

      - name: Publier le rapport visuel (inline)
        if: always()
        uses: ./.github/actions/visual-report
        with:
          report: samples/hello-triangle/build/visual/report.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-triangle-windows-visual
          path: |
            samples/hello-triangle/build/visual/hello-triangle.actual.png
            samples/hello-triangle/build/visual/hello-triangle.diff.png
            tests/visual/baselines/windows/hello-triangle.png
          if-no-files-found: ignore
