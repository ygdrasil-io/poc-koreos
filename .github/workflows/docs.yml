name: Deploy docs (MkDocs Material → GitHub Pages)

# Triggered on push to master when the docs sources change,
# or manually via workflow_dispatch.
# The Dokka GFM generation is done locally and committed in docs/
# (see buildSrc/.../kmp-dokka.gradle.kts + GRA-157).

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # redeploy the web demos when the samples or the web stack change.
      - 'samples/hello-window-web/**'
      - 'samples/hello-triangle-web/**'
      - 'kadre-js/**'
      - 'kadre-wasm/**'
      - 'kadre-web-common/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material + plugins
        run: |
          python -m pip install --upgrade pip
          # awesome-pages removed: incompatible with mkdocs-static-i18n
          # (NavEntryNotFound during the secondary-language rebuild).
          # Explicit navigation in mkdocs.yml instead.
          pip install mkdocs-material mkdocs-static-i18n

      # The Dokka GFM files are already committed in docs/kadre/api/.
      # No Gradle regeneration needed here.
      - name: Build site (MkDocs)
        run: mkdocs build

      # ── Live web demos ──────────────────────────────────────
      # Build the web samples in production (JS variant) and copy them under _site/demos/
      # so they are served on the same Pages site as the docs, without a
      # concurrency-group conflict. The Node/webpack toolchain is enabled by #91.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build web samples (production JS bundles)
        run: |
          ./gradlew \
            :samples:hello-window-web:jsBrowserDistribution \
            :samples:hello-triangle-web:jsBrowserDistribution \
            --no-daemon --stacktrace

      - name: Assemble demos into _site/demos
        run: |
          mkdir -p _site/demos
          cp -r samples/hello-window-web/build/dist/js/productionExecutable   _site/demos/hello-window-web
          cp -r samples/hello-triangle-web/build/dist/js/productionExecutable _site/demos/hello-triangle-web
          cat > _site/demos/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Kadre — démos web live</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.5rem; }
              li { margin: .5rem 0; }
            </style>
          </head>
          <body>
            <h1>Kadre — démos web live</h1>
            <p>Samples Kadre compilés en Kotlin/JS et exécutés dans le navigateur (WebGPU requis pour le triangle).</p>
            <ul>
              <li><a href="hello-window-web/">hello-window-web</a> — fenêtre canvas + journal d'événements DOM</li>
              <li><a href="hello-triangle-web/">hello-triangle-web</a> — triangle RGB via wgpu4k Web</li>
            </ul>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
