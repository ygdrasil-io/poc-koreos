name: linux-visual

# Linux visual regression via GPU readback.
# The capture reuses the kadre EventLoop to obtain a Wayland window, hence the
# wgpu surface, then renders offscreen + readback. NON-BLOCKING.
#
# Headless: Weston Wayland compositor (headless backend) + software Vulkan (Mesa
# lavapipe), since the runners have no GPU.

on:
  push:
    branches: [master]
    paths:
      - 'samples/hello-triangle/**'
      - 'tests/visual/**'
      - '.github/workflows/linux-visual.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/hello-triangle/**'
      - 'tests/visual/**'
      - '.github/workflows/linux-visual.yml'
  workflow_dispatch:

jobs:
  linux-visual:
    name: linux-visual
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push captures to the orphan branch ci-visual-reports
      pull-requests: write   # PR comment with the inline gallery
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Wayland compositor + software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            weston \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools

      - name: Start headless Weston
        run: |
          weston --version || true
          export XDG_RUNTIME_DIR=/tmp/wl-runtime
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          # weston 13 (Ubuntu 24.04): headless-backend.so module + Pixman renderer
          # (software — no EGL/GPU required for the compositor itself).
          weston \
            --backend=headless-backend.so \
            --renderer=pixman \
            --width=800 --height=600 \
            --socket=wayland-ci \
            --idle-time=0 \
            --log=/tmp/weston.log \
            > /tmp/weston.stdout 2>&1 &
          for i in $(seq 1 60); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 0.5
          done
          echo "----- weston.log -----";    cat /tmp/weston.log    2>/dev/null || true
          echo "----- weston.stdout -----"; cat /tmp/weston.stdout 2>/dev/null || true
          if [ -S "$XDG_RUNTIME_DIR/wayland-ci" ]; then
            echo "✅ socket Wayland présent"
            echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          else
            echo "::warning::socket Wayland absent — capture sautée"
          fi
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Diagnostic: where is the lavapipe ICD + is the software Vulkan loaded?
      - name: Vulkan/WSI diagnostic
        continue-on-error: true
        run: |
          echo "----- ICDs installés -----"
          ls -la /usr/share/vulkan/icd.d/ 2>&1 || true
          echo "----- fichiers de mesa-vulkan-drivers -----"
          dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -iE 'icd|json|lvp' || true
          echo "----- vulkaninfo --summary (auto-découverte ICD) -----"
          vulkaninfo --summary 2>&1 | head -40 || true
          echo "----- extensions surface/wayland -----"
          vulkaninfo 2>&1 | grep -iE "VK_KHR_(surface|wayland_surface|xcb_surface|swapchain)" | sort -u || true

      - name: Capture GPU offscreen (hello-triangle)
        id: capture
        continue-on-error: true
        env:
          # Let the Vulkan loader auto-discover the installed ICDs (lavapipe included),
          # rather than forcing a path that may be wrong. Software GL fallback.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Only run the capture if a Wayland compositor is available
          # (avoids a native abort of the Wayland stack without a display).
          if [ -z "$WAYLAND_DISPLAY" ] || [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            echo "::warning::pas de compositor Wayland — capture Linux sautée"
            exit 0
          fi
          ./gradlew :samples:hello-triangle:run \
            --args="--capture build/visual/hello-triangle.actual.png" \
            --no-daemon --stacktrace

      # Diagnostic: if the JVM crashed (native FFM), surface the hs_err (calling Java
      # frames + native frames) directly in the CI log.
      - name: Dump crash report (hs_err)
        if: always()
        run: |
          f=$(ls -t samples/hello-triangle/hs_err_pid*.log 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            echo "===== $f (extrait) ====="
            sed -n '1,40p' "$f"
            echo "----- Native frames / Java frames -----"
            awk '/Native frames|Java frames|Stack:/{f=1} f{print} /^$/{if(f)n++} n>3{exit}' "$f" | head -60
          else
            echo "Aucun hs_err trouvé."
          fi

      - name: Diff visuel vs baseline (non bloquant)
        if: always()
        run: |
          cd tests/visual && npm install && cd -
          DIR=samples/hello-triangle/build/visual
          node tests/visual/diff-cli.js \
            "$DIR/hello-triangle.actual.png" \
            tests/visual/baselines/linux/hello-triangle.png \
            "$DIR/hello-triangle.diff.png" \
            0.02 \
            "$DIR/report.json" \
            Linux || true

      - name: Publier le rapport visuel (inline)
        if: always()
        uses: ./.github/actions/visual-report
        with:
          report: samples/hello-triangle/build/visual/report.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-triangle-linux-visual
          path: |
            samples/hello-triangle/build/visual/hello-triangle.actual.png
            samples/hello-triangle/build/visual/hello-triangle.diff.png
            tests/visual/baselines/linux/hello-triangle.png
          if-no-files-found: ignore
