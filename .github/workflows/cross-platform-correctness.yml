name: cross-platform-correctness

on:
  pull_request:

jobs:
  host-contracts:
    name: host contracts
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install structured YAML parser for the workflow contract
        run: |
          python3 -m venv .workflow-contract-venv
          .workflow-contract-venv/bin/python -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$PWD/.workflow-contract-venv/bin" >> "$GITHUB_PATH"
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-workflow-contract.sh
      - run: >-
          ./gradlew :kadre-test:allTests :kadre:jvmTest :kadre-x11:jvmTest
          :kadre-wayland:jvmTest :kadre-appkit:jvmTest --no-daemon --console=plain

  web-browser-contracts:
    name: web browser JS/Wasm contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: browser-actions/setup-chrome@v1
      - run: sudo apt-get update && sudo apt-get install -y libxml-parser-perl
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-web-browsers.sh

  ios-simulator-contracts:
    name: iOS simulator UIKit contracts
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-uikit-simulator.sh

  android-emulator-contracts:
    name: Android emulator contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-android-device-selection.sh
      - name: Run deterministic Android emulator contract
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: scripts/android-emulator-test.sh

  linux-container-contracts:
    name: Linux ${{ matrix.libc }} X11/Wayland contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-linux-container.sh ${{ matrix.libc }}

  deterministic-captures:
    name: deterministic raster capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew scripts/*.sh
      - run: >-
          ./gradlew :samples:compose:desktop:run
          --args="--ci-headless build/cross-platform-correctness"
          --no-daemon --console=plain
      - run: >-
          python3 scripts/verify-test-results.py
          --png samples/compose/desktop/build/cross-platform-correctness/compose-showcase.raster.png
          --png-target compose-raster
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-compose-raster
          path: samples/compose/desktop/build/cross-platform-correctness/compose-showcase.raster.png
          if-no-files-found: error

  linux-compose-windowed-capture:
    name: Linux Compose windowed capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Refresh APT package index
        run: sudo apt-get update
      - name: Install Wayland capture dependencies
        run: >-
          sudo apt-get install -y weston libwayland-client0
          libwayland-egl1 libxkbcommon0 libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Start deterministic headless Weston
        run: |
          export XDG_RUNTIME_DIR=/tmp/kadre-wl-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe weston \
            --backend=headless-backend.so --renderer=gl --width=800 --height=600 \
            --socket=wayland-ci --idle-time=0 --log=/tmp/weston.log > /tmp/weston.stdout 2>&1 &
          for _ in $(seq 1 60); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 0.5
          done
          test -S "$XDG_RUNTIME_DIR/wayland-ci"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-linux-compose-windowed-capture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-compose-windowed
          path: samples/compose/desktop/build/cross-platform-correctness/compose-desktop.window.png
          if-no-files-found: error

  macos-offscreen-capture:
    name: macOS offscreen capture
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: chmod +x gradlew scripts/*.sh
      - run: scripts/test-macos-offscreen-capture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-macos-offscreen
          path: samples/hello-triangle/build/visual/hello-triangle.actual.png
          if-no-files-found: error

  cross-platform-correctness:
    name: cross-platform-correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - host-contracts
      - web-browser-contracts
      - ios-simulator-contracts
      - android-emulator-contracts
      - linux-container-contracts
      - deterministic-captures
      - linux-compose-windowed-capture
      - macos-offscreen-capture
    steps:
      - name: Require host contracts to succeed
        run: '[[ "${{ needs.host-contracts.result }}" == "success" ]]'
      - name: Require web browser contracts to succeed
        run: '[[ "${{ needs.web-browser-contracts.result }}" == "success" ]]'
      - name: Require iOS simulator contracts to succeed
        run: '[[ "${{ needs.ios-simulator-contracts.result }}" == "success" ]]'
      - name: Require Android emulator contracts to succeed
        run: '[[ "${{ needs.android-emulator-contracts.result }}" == "success" ]]'
      - name: Require Linux container contracts to succeed
        run: '[[ "${{ needs.linux-container-contracts.result }}" == "success" ]]'
      - name: Require deterministic captures to succeed
        run: '[[ "${{ needs.deterministic-captures.result }}" == "success" ]]'
      - name: Require Linux Compose windowed capture to succeed
        run: '[[ "${{ needs.linux-compose-windowed-capture.result }}" == "success" ]]'
      - name: Require macOS offscreen capture to succeed
        run: '[[ "${{ needs.macos-offscreen-capture.result }}" == "success" ]]'
