name: Kadre Web Contracts

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  web-contracts:
    name: web-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kadre/contracts/driver/web/package-lock.json

      - name: Install locked Playwright dependencies
        run: npm ci --prefix kadre/contracts/driver/web

      - name: Provision Chromium
        run: npx --prefix kadre/contracts/driver/web playwright install --with-deps chromium

      - name: Run Web browser contract smoke gate
        run: ./gradlew :kadre:contracts:driver:web:browserSmokeRunnerTest :kadre:contracts:driver:web:jsBrowserSmoke :kadre:contracts:driver:web:wasmJsBrowserSmoke :kadre:contracts:validator:check --console=plain

      - name: Compile the desk-tour web sample (rot-guard)
        # Compile-only rot-guard: the desk-tour demo's wasmJs chain (shared core+ui, the
        # web host, the Compose-for-web dependency chain) must stay green on every push.
        # The full distribution + e2e net is deliberately OUT of this workflow: the ~13 MB
        # distribution build plus a served Playwright pass do not fit the 15-minute budget
        # this workflow already spends on the contract gate — the e2e net stays local and
        # is chartered (kadre/samples/desk-tour/e2e/README.md,
        # kadre/samples/desk-tour/manual/web-charter.md). Its own step, after the gate,
        # so a failure here can never mask the gate's evidence.
        run: ./gradlew :kadre:samples:desk-tour:compileKotlinWasmJs --console=plain

      - name: Upload Web diagnostics and evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: kadre-web-contract-failure-artifacts
          path: |
            kadre/contracts/driver/web/build/dist/
            kadre/contracts/driver/web/build/contract-evidence/
          if-no-files-found: ignore
          include-hidden-files: true
