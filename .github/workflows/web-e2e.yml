name: web-e2e

# Web E2E smoke test: "at least one frame presented"
# + visual diff on hello-triangle-web. Builds the production JS bundle, serves
# it, then launches **stable Chrome** on macOS (Metal) and Windows (D3D12).
#
# Why not Linux/SwiftShader?
# - WebGPU still experimental on Linux, software rendering may differ.
# - Stable Chrome on macOS/Windows = WebGPU stable since Chrome 113 +
#   real GPU (Metal/D3D12) = better reflects end-user usage.

on:
  push:
    branches: [master]
    paths:
      - 'samples/hello-triangle-web/**'
      - 'kadre-js/**'
      - 'kadre-web-common/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches: [master]
    paths:
      - 'samples/hello-triangle-web/**'
      - 'kadre-js/**'
      - 'kadre-web-common/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

jobs:
  web-e2e:
    name: web-e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows-latest excluded: the GitHub Actions Windows runners are Hyper-V
        # VMs without GPU passthrough, and neither stable Chrome nor Chromium
        # manage to initialize a usable WebGPU adapter (tested with all the
        # combinations --enable-unsafe-webgpu / SwiftShader ANGLE /
        # SwiftShader Vulkan / --use-vulkan=swiftshader — `requestAdapter()`
        # returns `null` every time). See PR #131 for the history of the
        # 3 attempts. To be revisited when Windows runners with GPU
        # passthrough become available (or via self-hosted).
        # Windows compile/test coverage remains ensured by `Kadre CI`
        # (job `windows-build`).
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Bash on all runners (Git Bash on Windows) to standardize the
        # commands (./gradlew, redirections, [ -f ... ]).
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build hello-triangle-web (production JS bundle)
        run: ./gradlew :samples:hello-triangle-web:jsBrowserDistribution --no-daemon --stacktrace

      - name: Install E2E deps
        working-directory: samples/hello-triangle-web/e2e
        run: npm install

      - name: Use system Chrome (macOS runners have it pre-installed)
        run: |
          echo "CHROME_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          echo "Using system Chrome at $(ls -d /Applications/Google\ Chrome.app 2>/dev/null || echo 'not found')"

      - name: Run Playwright smoke + visual tests
        working-directory: samples/hello-triangle-web/e2e
        run: npx playwright test

      # Visual summary directly on the run page.
      - name: Publier le résumé visuel
        if: always()
        run: |
          SUMMARY=samples/hello-triangle-web/e2e/test-results/visual-summary.md
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Captures (smoke + visual regression) — separated by OS so we can
      # compare macOS Metal vs Windows SwiftShader. Also includes the
      # `error-context.md` produced by Playwright on failure (console
      # logs, page errors, network) to ease remote debugging.
      - name: Upload captures + debug context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-triangle-web-captures-${{ matrix.os }}
          path: |
            samples/hello-triangle-web/e2e/triangle.png
            samples/hello-triangle-web/e2e/baselines/hello-triangle-web.png
            samples/hello-triangle-web/e2e/test-results/hello-triangle-web.actual.png
            samples/hello-triangle-web/e2e/test-results/hello-triangle-web.diff.png
            samples/hello-triangle-web/e2e/test-results/**/error-context.md
            samples/hello-triangle-web/e2e/test-results/**/trace.zip
          if-no-files-found: ignore
