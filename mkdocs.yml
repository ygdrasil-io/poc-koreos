site_name: Kadre
site_description: Cross-platform windowing & events for Kotlin Multiplatform
site_url: https://ygdrasil-io.github.io/poc-koreos/
repo_url: https://github.com/ygdrasil-io/poc-koreos
repo_name: ygdrasil-io/poc-koreos

docs_dir: docs
site_dir: _site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Navigation explicite — remplace `awesome-pages` (incompatible avec
# mkdocs-static-i18n : pendant le rebuild FR, i18n remappe `index.fr.md`
# en `index.md` actif du build FR et awesome-pages ne retrouve plus les
# entrées listées dans les `.pages`, levant `NavEntryNotFound`).
#
# Les fichiers sont référencés sans suffixe de langue ; le plugin i18n
# choisit la bonne variante (`*.md` pour EN, `*.fr.md` pour FR) selon
# le build en cours.
nav:
  - Home: kadre/index.md
  - Blog:
      - kadre/blog/v0.2.0-release.md
  - Tutorials:
      - kadre/tutorials/windows-app.md
      - kadre/tutorials/linux-app.md
      - kadre/tutorials/web-embed.md
  - Plan: kadre/plan.md
  - Plan v0.2: kadre/plan-v0.2.md
  - Sprint Review v0.1: kadre/sprint-review-v0.1.md
  - Post-mortem M2: kadre/postmortem-m2.md
  - Specs: kadre/specs.md
  - Specs v0.2: kadre/specs-v0.2.md
  - API Stability: kadre/api-stability.md
  - Performance: kadre/performance.md
  - Release Process: kadre/release-process.md
  - Testing: kadre/testing.md
  - Visual Testing: kadre/visual-testing.md
  - Roadmap Progress: kadre/roadmap-progress.md
  - API Reference: kadre/api/index.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Kadre
          site_description: Fenêtrage et événements multiplateforme pour Kotlin Multiplatform
          # Traductions des titres de nav (les sections / pages listées dans
          # le `nav:` global ci-dessus).
          nav_translations:
            Home: Accueil
            Blog: Blog
            Tutorials: Tutoriels
            Plan: Plan
            Plan v0.2: Plan v0.2
            Sprint Review v0.1: Sprint Review v0.1
            Post-mortem M2: Post-mortem M2
            Specs: Spécifications
            Specs v0.2: Spécifications v0.2
            API Stability: Stabilité API
            Performance: Performance
            Release Process: Processus de release
            Testing: Tests
            Visual Testing: Tests visuels
            Roadmap Progress: Avancement roadmap
            API Reference: Référence API
